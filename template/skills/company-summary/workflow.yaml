schema_version: 1
id: company-summary
version: 3
owner: process-owner-selected-by-company
standards:
- standards/task-validation.md
capabilities:
- files
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
- 'For saved branch only: accepted owning task ID and action-summary criterion'
output: Read-only observed summary OR verified action-summary artifact owned by an
  accepted task
steps:
- id: read-context
  operation: context
  instruction: >-
    Прочитать владельца задачи и действующие права один раз; использовать уже полученный контекст
    этой задачи, если он не изменился. Частота входного preflight — task-validation. При подготовке
    намерения один раз прочитать task/context (для новой задачи использовать ответ intake/decide),
    сохранить revision и текущий output; не подставлять новую revision в прежний кандидат.
  depends_on: []
- id: prepare-summary
  operation: summary
  instruction: 'Просмотр: summary без --task, вернуть наблюдённое состояние без execute.
    Сохранение отдельного результата: только для принятой задачи с action-summary
    критерием вызвать summary --task owning-id; immutable snapshot исключает собственную
    задачу. Показать delivery/application/effect и output отдельно; observed не означает положительный эффект.'
  depends_on:
  - read-context
- id: execute-saved-summary
  operation: execute
  instruction: >-
    Только ветка сохранения: передать подготовленный action-summary artifact, critical и
    обязательный review в один execute. При простом просмотре этот шаг пропустить. Передать
    сохранённую при подготовке намерения revision через --expected-revision N. При конфликте
    перечитать task/context, сверить новые данные с намерением и заново подготовить кандидат; просто
    взять последнюю revision и повторить прежний кандидат запрещено.
  depends_on:
  - prepare-summary
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
dependency_paths:
- scripts/operations.py
