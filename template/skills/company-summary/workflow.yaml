schema_version: 1
id: company-summary
version: 1
owner: process-owner-selected-by-company
standards:
- standards/task-validation.md
- standards/task-validation.md
capabilities:
- files
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
- owning task ID with accepted action-summary criterion
output: summary output referenced by owning task; provenance and limitations required
steps:
- id: read-context
  operation: context
  depends_on: []
- id: perform-operation
  operation: summary
  instruction: Call summary --task owning-id; immutable input snapshot excludes its own task
  depends_on:
  - read-context
- id: validate-result
  operation: execute
  depends_on:
  - perform-operation
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
