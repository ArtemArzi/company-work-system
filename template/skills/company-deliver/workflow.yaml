schema_version: 1
id: company-deliver
version: 6
owner: process-owner-selected-by-company
standards:
- standards/template-update.md
- standards/task-validation.md
capabilities:
- git
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
output: Confirmed delivery receipt and task acknowledgment when requested; successful
  readback and explicit source completion are distinct
steps:
- id: read-context
  operation: context
  instruction: >-
    Прочитать владельца задачи и действующие права один раз; использовать уже полученный контекст
    этой задачи, если он не изменился. Частота входного preflight — task-validation. При подготовке
    намерения один раз прочитать task/context (для новой задачи использовать ответ intake/decide),
    сохранить revision и текущий output; не подставлять новую revision в прежний кандидат.
  depends_on: []
- id: deliver-verified-result
  operation: deliver
  instruction: Использовать готовый проверенный результат либо принятый кандидат.
    При необходимости prepare и commit только точных разрешённых paths по template-update/runtime.
    Для обычного prepare-кандидата использовать ignored default и deliver --finish; remote readback
    и workspace_reconciled проверять отдельно. Work использует local sync. При delivered-local-pending
    сохранить candidate/readback и завершить только допустимый локальный шаг, не повторять push вслепую. Receipt доставки
    не является новым Result, execute после доставки не нужен.
    При необходимости сверить exact paths через preservation; локальный файл, Git HEAD,
    recorded readback и резервная копия означают разные наблюдения. Вне-Git документы
    копировать только явно выбранным snapshot по template-update, без расширения экспорта.
    Проверить storage_status; при удержании или лимите читать candidate-status и продолжать
    существующую попытку. Не обходить лимит ручными clones. Использовать готовый Python source для scripts/system.py самого кандидата
    с --root кандидата; собственные завершённые неизменённые копии закрывает следующая подготовка.
  depends_on:
  - read-context
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
dependency_paths:
- scripts/delivery.py
- scripts/candidate_storage.py
- scripts/history.py
- scripts/preservation.py
- standards/runtime.md
