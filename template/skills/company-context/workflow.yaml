schema_version: 1
id: company-context
version: 3
owner: process-owner-selected-by-company
standards:
- standards/runtime.md
- standards/task-validation.md
capabilities:
- files
- critical
- git
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
- task entry preflight, reused within the same task according to task-validation
output: context output referenced by owning task; provenance and limitations required
steps:
- id: receive-shared-state
  operation: preflight
  depends_on: []
- id: read-context
  operation: context
  depends_on:
  - receive-shared-state
- id: perform-operation
  operation: context
  depends_on:
  - read-context
- id: validate-result
  operation: execute
  depends_on:
  - perform-operation
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
