schema_version: 1
id: company-incident
version: 2
owner: process-owner-selected-by-company
standards:
- standards/task-validation.md
capabilities:
- files
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
output: Recorded incident and explicit permitted continuation; blocked is not a verified result
steps:
- id: read-context
  operation: context
  instruction: Прочитать владельца задачи и действующие права один раз; использовать уже полученный контекст
    этой задачи, если он не изменился. Частота входного preflight — task-validation.
  depends_on: []
- id: record-incident
  operation: incident
  instruction: Сохранить наблюдаемый сбой, первое неверное допущение и следующий шаг у исходной задачи; incident
    отмечает blocked. По task-validation провести bounded diagnosis/repair в разрешённой области и повторить
    проблемный случай. При неизменённых confirmed/unknowns/bindings/критерии продолжить company-execute исходного
    Result без нового решения владельца. При изменённых зависимостях или неизвестном праве/смысле нужна соответствующая
    сверка владельцем (rebind/decide по runtime); её не подменять техническим исправлением. Receipt инцидента
    не передавать в execute.
  depends_on:
  - read-context
on_error: Record observed failure at owning task; block dependent action; preserve candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts without new evidence
