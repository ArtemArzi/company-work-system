schema_version: 1
id: company-execute
version: 3
owner: process-owner-selected-by-company
standards:
- standards/task-validation.md
capabilities:
- validation
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
output: One verified result bound to accepted criterion, exact inputs and required
  review
steps:
- id: read-context
  operation: context
  instruction: >-
    Прочитать владельца задачи и действующие права один раз; использовать уже полученный контекст
    этой задачи, если он не изменился. Частота входного preflight — task-validation. При подготовке
    намерения один раз прочитать task/context (для новой задачи использовать ответ intake/decide),
    сохранить revision и текущий output; не подставлять новую revision в прежний кандидат.
  depends_on: []
- id: execute-result
  operation: execute
  instruction: >-
    Подготовить artifact, critical и обязательный review для уже принятой active задачи. Один вызов
    execute проверяет их и сохраняет результат. Не вызывать execute второй раз для проверки
    собственного receipt. Передать сохранённую при подготовке намерения revision через --expected-revision N. При конфликте перечитать task/context, сверить новые данные с намерением и заново
    подготовить кандидат; просто взять последнюю revision и повторить прежний кандидат запрещено.
  depends_on:
  - read-context
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
dependency_paths:
- scripts/operations.py
