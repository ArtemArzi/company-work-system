schema_version: 1
id: company-intake
version: 2
owner: process-owner-selected-by-company
standards:
- standards/task-validation.md
capabilities:
- files
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
output: Accepted active task or explicit waiting with blocker; no result execution
  at intake
steps:
- id: read-context
  operation: context
  instruction: Прочитать владельца задачи и действующие права один раз; использовать
    уже полученный контекст этой задачи, если он не изменился. Частота входного preflight
    — task-validation.
  depends_on: []
- id: accept-request
  operation: intake
  instruction: Сохранить исходный запрос, критерий и известного владельца. Неподтверждённое/unknown
    остаётся waiting; принятие решения — decide с текущей revision и основанием владельца.
    Выполнение результата относится к company-execute.
  depends_on:
  - read-context
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
dependency_paths:
- scripts/operations.py
