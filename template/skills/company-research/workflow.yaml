schema_version: 1
id: company-research
version: 4
owner: process-owner-selected-by-company
standards:
- standards/data-access.md
- standards/task-validation.md
capabilities:
- files
- critical
inputs:
- accepted request, company identity/scope, exact versions, allowed sources
output: Verified sourced research Result with limitations; no implicit external publication
steps:
- id: read-context
  operation: context
  instruction: >-
    Прочитать владельца задачи и действующие права один раз; использовать уже полученный контекст
    этой задачи, если он не изменился. Частота входного preflight — task-validation. При подготовке
    намерения один раз прочитать task/context (для новой задачи использовать ответ intake/decide),
    сохранить revision и текущий output; не подставлять новую revision в прежний кандидат.
  depends_on: []
- id: prepare-research
  operation: research
  instruction: Это подготовка агентом, а не одноимённая команда CLI. Выбрать профильный
    поиск, первичные источники и контрпример; подготовить Result research по принятому
    критерию. Команды и источники — только в разрешённой области.
    Для нового существенного сохраняемого исследования выбрать acceptance research_evidence_version=1
    и при обязательном независимом review research_review_process_required. Подготовить точные
    evidence spans, решение, условия применения, gaps и recheck по runtime; review должен
    проверять смысловую поддержку всех ключевых выводов и сохранять фактический process report.
  depends_on:
  - read-context
- id: execute-research-result
  operation: execute
  instruction: >-
    Один execute подготовленного Result, critical и обязательного review. Передать сохранённую при
    подготовке намерения revision через --expected-revision N. При конфликте перечитать
    task/context, сверить новые данные с намерением и заново подготовить кандидат; просто взять
    последнюю revision и повторить прежний кандидат запрещено.
  depends_on:
  - prepare-research
on_error: Record observed failure at owning task; block dependent action; preserve
  candidate
stop: Missing authority/definition, changed version, cancelled task or two attempts
  without new evidence
dependency_paths:
- scripts/operations.py
- scripts/research_evidence.py
- standards/runtime.md
- standards/data-access.md
