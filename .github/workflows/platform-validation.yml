name: Platform candidate validation
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact full candidate commit SHA (product repository)
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CWS_BOOTSTRAP_NETWORK: '1'
    steps:
      - name: Require immutable candidate
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Full SHA required' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check candidate identity
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'Candidate changed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r template/requirements.txt
      - name: Run common acceptance
        run: python -m unittest discover -s checks -v
      - name: Produce synthetic OS backup
        shell: pwsh
        run: |
          if ('${{ matrix.os }}' -eq 'ubuntu-24.04') {
            python checks/platform_transfer.py produce .local/transfer --legacy
          } else {
            python checks/platform_transfer.py produce .local/transfer
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-backup-${{ matrix.os }}
          path: .local/transfer/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  transfer:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r template/requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: synthetic-backup-*
          path: .local/incoming
      - name: Verify actual cross-OS and original1.2 restore
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'Exact candidate required' }
          if ('${{ matrix.os }}' -eq 'ubuntu-24.04') {
            python checks/platform_transfer.py verify .local/incoming .local/restored --old-reader
          } else {
            python checks/platform_transfer.py verify .local/incoming .local/restored
          }
